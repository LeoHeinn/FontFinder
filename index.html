<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Finder</title>
  <style>
    /* Colours in one place, so dark mode only has to change these. */
    :root {
      color-scheme: light dark;
      --text: #222;
      --background: #fff;
      --muted: #555;
      --border: #ccc;
      --error: #b00020;
      --accent: #2563eb;
      --zone: #f6f7f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e6e6e6;
        --background: #16181b;
        --muted: #a3a3a3;
        --border: #444;
        --error: #ff6b6b;
        --accent: #7aa2ff;
        --zone: #1f2226;
      }
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--background);
    }
    h1 { margin-bottom: 0.25rem; }
    .note { font-size: 0.9rem; color: var(--muted); }
    button { padding: 0.5rem 1rem; font-size: 1rem; margin-top: 0.75rem; margin-right: 0.5rem; }
    #dropZone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 1rem;
      background: var(--zone);
    }
    #dropZone.dragging { border-color: var(--accent); }
    #dropZone p { margin-top: 0; }
    #preview { max-width: 100%; max-height: 240px; margin-top: 1rem; display: none; border: 1px solid var(--border); }
    #status { margin-top: 1rem; }
    #status.error { color: var(--error); }
    #result { margin-top: 1rem; padding: 1rem; border: 1px solid var(--border); border-radius: 6px; display: none; }
    #result .label { margin: 0; font-size: 0.9rem; color: var(--muted); }
    #result h2 { margin: 0 0 0.5rem; font-size: 2rem; }
    #result p { margin: 0.25rem 0; }
    #result a { color: var(--accent); }
    /* The font name is the Google Fonts search link. Without an href (font "Unknown") it looks like plain text. */
    #familyLink[href] { background: var(--zone); border-radius: 4px; padding: 0.05rem 0.35rem; }
    #familyLink:not([href]) { color: inherit; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.25rem 0 0.5rem; }
    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.15rem 0.7rem;
      text-decoration: none;
    }
    dt { font-weight: bold; margin-top: 0.5rem; }
    dd { margin: 0; }
    footer { margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Font Finder</h1>

  <div id="dropZone">
    <p>Drop a screenshot here, paste it, or choose a file.</p>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
    <p class="note">PNG, JPEG or WebP, up to 1 MB.</p>
  </div>

  <button id="detectButton" disabled>Find font</button>
  <button id="resetButton" type="button" hidden>Try another image</button>

  <p id="status" role="status"></p>
  <img id="preview" alt="Preview of the chosen image">

  <div id="result">
    <p class="label">Font category</p>
    <h2 id="category"></h2>
    <p>
      Best guess:
      <a id="familyLink" target="_blank" rel="noopener noreferrer" title="Search Google Fonts for this name"><strong id="family"></strong></a>
    </p>
    <p>Could also be:</p>
    <div id="alternatives" class="chips"></div>
    <dl>
      <dt>Confidence</dt><dd id="confidence"></dd>
      <dt>Approximate size</dt><dd id="size"></dd>
    </dl>
  </div>

  <footer class="note">
    Your image is sent to Google's Gemini API to identify the font. This site's server
    does not save it.
  </footer>

  <script>
    // Change this to the Render URL when the backend is deployed.
    const API_URL = "http://127.0.0.1:8000";

    const MAX_BYTES = 1024 * 1024; // same limit as the backend (1 MiB)
    const ALLOWED_TYPES = ["image/png", "image/jpeg", "image/webp"];
    const TIMEOUT_MS = 90000; // Render's free tier can take 30 to 50 s to wake up
    const SLOW_AFTER_SECONDS = 20; // after this, tell the user the server may be busy

    // The backend sends these values. Anything else is shown as it is.
    const CATEGORY_LABELS = {
      "serif": "Serif",
      "sans-serif": "Sans-serif",
      "monospace": "Monospace",
      "script": "Script",
      "display": "Display",
    };

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const detectButton = document.getElementById("detectButton");
    const resetButton = document.getElementById("resetButton");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const familyLink = document.getElementById("familyLink");
    const alternativesEl = document.getElementById("alternatives");

    let selectedFile = null; // the file that "Find font" will send, from the picker, a drop or a paste
    let previewUrl = null;
    let progressTimer = null;
    let busy = false; // true while a request is running

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    function clearResult() {
      resultEl.style.display = "none";
    }

    // Returns an error message, or "" if the file is fine to upload.
    function checkFile(file) {
      if (!ALLOWED_TYPES.includes(file.type)) {
        return "Only PNG, JPEG and WebP images are accepted.";
      }
      if (file.size > MAX_BYTES) {
        return "File is too large. Maximum is 1 MB.";
      }
      return "";
    }

    function setPreview(file) {
      // Free the old preview, or the browser keeps it in memory until the page closes.
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      if (file) {
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.style.display = "block";
      } else {
        preview.removeAttribute("src");
        preview.style.display = "none";
      }
    }

    // Every way of choosing an image ends here, so the same checks apply to all of them.
    // Passing null clears the page.
    function handleFile(file) {
      if (busy) {
        return;
      }
      clearResult();
      showStatus("", false);
      resetButton.hidden = true;
      selectedFile = null;
      detectButton.disabled = true;
      setPreview(null);

      if (!file) {
        return;
      }
      const problem = checkFile(file);
      if (problem) {
        showStatus(problem, true);
        return;
      }
      selectedFile = file;
      setPreview(file);
      detectButton.disabled = false;
    }

    fileInput.addEventListener("change", function () {
      handleFile(fileInput.files[0] || null);
    });

    // The whole page accepts a drop, so a file dropped next to the box does not make the browser open it.
    document.addEventListener("dragover", function (event) {
      event.preventDefault();
      dropZone.classList.add("dragging");
    });

    document.addEventListener("dragleave", function (event) {
      // relatedTarget is null only when the pointer leaves the window.
      if (event.relatedTarget === null) {
        dropZone.classList.remove("dragging");
      }
    });

    document.addEventListener("drop", function (event) {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      if (event.dataTransfer.files.length > 0) {
        fileInput.value = ""; // the picker would still show the old file name
        handleFile(event.dataTransfer.files[0]);
      }
    });

    // Pasting text does nothing. Pasting an image (for example a screenshot) picks it.
    document.addEventListener("paste", function (event) {
      const items = event.clipboardData ? event.clipboardData.items : [];
      for (const item of items) {
        if (item.kind === "file" && item.type.startsWith("image/")) {
          event.preventDefault();
          fileInput.value = "";
          handleFile(item.getAsFile());
          return;
        }
      }
    });

    resetButton.addEventListener("click", function () {
      fileInput.value = "";
      handleFile(null);
    });

    // Shows "Working, 12 s" and updates it every second until stopProgress() is called.
    function startProgress() {
      const startedAt = Date.now();
      function update() {
        const seconds = Math.round((Date.now() - startedAt) / 1000);
        let message = "Working, " + seconds + " s.";
        if (seconds >= SLOW_AFTER_SECONDS) {
          message += " The server may be busy.";
        }
        showStatus(message, false);
      }
      update();
      progressTimer = setInterval(update, 1000);
    }

    function stopProgress() {
      clearInterval(progressTimer);
      progressTimer = null;
    }

    // Turns a failed response into a short message. Uses the backend's "detail" text when there is one.
    async function errorMessageFrom(response) {
      try {
        const body = await response.json();
        if (typeof body.detail === "string") {
          return body.detail;
        }
      } catch (e) {
        // The body was not JSON, fall through to the default message.
      }
      return "Something went wrong (status " + response.status + ").";
    }

    // Only ever builds a Google Fonts search. encodeURIComponent turns spaces, "&" and "<" into
    // safe characters, so a name from the model cannot change where the link goes.
    function googleFontsSearchUrl(name) {
      return "https://fonts.google.com/?query=" + encodeURIComponent(name);
    }

    function makeChip(name) {
      const chip = document.createElement("a");
      chip.className = "chip";
      chip.textContent = name;
      chip.href = googleFontsSearchUrl(name);
      chip.target = "_blank";
      chip.rel = "noopener noreferrer";
      chip.title = "Search on Google Fonts";
      return chip;
    }

    function showResult(data) {
      document.getElementById("category").textContent = CATEGORY_LABELS[data.category] || data.category;
      document.getElementById("family").textContent = data.family;

      // The prompt asks for "Unknown" when there is no readable text. Searching for that is pointless.
      const known = data.family.trim().toLowerCase() !== "unknown";
      if (known) {
        familyLink.href = googleFontsSearchUrl(data.family);
      } else {
        familyLink.removeAttribute("href"); // a link without href is plain text
      }

      alternativesEl.replaceChildren(); // remove chips from the previous result
      for (const name of data.alternatives) {
        alternativesEl.appendChild(makeChip(name));
      }

      document.getElementById("confidence").textContent = data.confidence;
      document.getElementById("size").textContent =
        data.sizeMinPx + " to " + data.sizeMaxPx + " px (" + data.sizeLabel + ")";
      resultEl.style.display = "block";
    }

    detectButton.addEventListener("click", async function () {
      if (!selectedFile) {
        return;
      }

      busy = true;
      clearResult();
      detectButton.disabled = true;
      fileInput.disabled = true;
      resetButton.hidden = true;
      startProgress();

      const formData = new FormData();
      formData.append("file", selectedFile);

      const controller = new AbortController();
      const timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);

      try {
        const response = await fetch(API_URL + "/detect", {
          method: "POST",
          body: formData,
          signal: controller.signal,
        });
        if (!response.ok) {
          showStatus(await errorMessageFrom(response), true);
          return;
        }
        const data = await response.json();
        showStatus("", false);
        showResult(data);
      } catch (e) {
        if (e.name === "AbortError") {
          showStatus("The server took too long to answer. Try again.", true);
        } else {
          showStatus("Could not reach the server. Check your connection and try again.", true);
        }
      } finally {
        // Runs after the result or the error message is shown, so the timer cannot overwrite them.
        stopProgress();
        clearTimeout(timer);
        busy = false;
        detectButton.disabled = false;
        fileInput.disabled = false;
        resetButton.hidden = false;
      }
    });
  </script>
</body>
</html>
